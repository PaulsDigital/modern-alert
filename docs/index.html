<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ModernAlert</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/modern-alert@1.3.0/src/modern-alert.css">
  <style>
    :root {
      --bg: #f4f4f7;
      --panel: #ffffff;
      --line: rgba(24, 24, 32, 0.08);
      --text: #18181b;
      --muted: #71717a;
      --accent: #7c5cff;
      --field: #f7f7f9;
      font-family: "SF Pro Display", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(124, 92, 255, 0.14), transparent 50%),
        radial-gradient(900px 500px at -10% 100%, rgba(62, 207, 142, 0.1), transparent 50%),
        var(--bg);
    }

    .app {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
    }

    .side {
      border-right: 1px solid var(--line);
      padding: 28px 18px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(16px);
    }

    .brand {
      padding: 0 10px 22px;
    }

    .brand strong {
      display: block;
      font-size: 1.05rem;
      letter-spacing: -0.03em;
    }

    .brand span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 10px 12px;
      border-radius: 12px;
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .nav button:hover,
    .nav button.is-active {
      background: rgba(24, 24, 32, 0.05);
    }

    .nav button small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.72rem;
    }

    .main {
      padding: 28px 32px 40px;
      max-width: 880px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: -0.04em;
    }

    .top p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: 0;
      height: 38px;
      padding: 0 14px;
      border-radius: 11px;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 550;
      cursor: pointer;
      color: var(--text);
      background: rgba(24, 24, 32, 0.06);
    }

    .btn:hover { background: rgba(24, 24, 32, 0.1); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover { filter: brightness(1.06); }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 1px 2px rgba(24, 24, 32, 0.04);
    }

    .card h2 {
      margin: 0 0 14px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .card-head h2 {
      margin: 0;
    }

    .btn-quiet {
      height: 32px;
      padding: 0 12px;
      font-size: 0.78rem;
    }

    .code {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      line-height: 1.55;
      color: #3f2d9c;
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      overflow: auto;
      white-space: pre;
    }

    label.row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    input[type="text"],
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--field);
      color: var(--text);
      border-radius: 12px;
      font: inherit;
      font-size: 0.9rem;
      padding: 0 12px;
      outline: none;
    }

    input[type="text"],
    select { height: 40px; }

    textarea {
      min-height: 72px;
      padding: 10px 12px;
      resize: vertical;
    }

    .checks {
      display: grid;
      gap: 8px;
      margin-top: 4px;
    }

    .checks label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      color: var(--text);
      cursor: pointer;
    }

    .log {
      margin-top: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      line-height: 1.5;
      color: #5b3cc4;
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      min-height: 92px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .hint {
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .hint a {
      color: inherit;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78em;
      background: rgba(24, 24, 32, 0.06);
      padding: 1px 6px;
      border-radius: 6px;
    }

    .is-html .text-only,
    .is-loading .not-loading { display: none; }

    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      .side { border-right: 0; border-bottom: 1px solid var(--line); }
      .nav { flex-direction: row; overflow: auto; }
      .nav button { min-width: max-content; }
      .grid { grid-template-columns: 1fr; }
      .main { padding: 20px 16px 32px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <strong>ModernAlert</strong>
        <span>Live playground</span>
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>

    <main class="main">
      <div class="top">
        <div>
          <h1 id="heading">success</h1>
          <p id="lead">Pick a type, tweak options, then press Show.</p>
        </div>
        <div class="tools">
          <button class="btn btn-primary" id="showBtn" type="button">Show</button>
        </div>
      </div>

      <div class="grid">
        <section class="card">
          <h2>Content</h2>
          <label class="row">Title
            <input id="title" type="text">
          </label>
          <label class="row text-only">Text
            <textarea id="text"></textarea>
          </label>
          <label class="row html-only" hidden>HTML
            <textarea id="html"></textarea>
          </label>
          <label class="row not-loading">Confirm button
            <input id="confirmText" type="text">
          </label>
          <label class="row not-loading">Cancel button
            <input id="cancelText" type="text" placeholder="empty — hidden">
          </label>
        </section>

        <section class="card">
          <h2>Behavior</h2>
          <label class="row">Dialog theme
            <select id="theme">
              <option value="auto">Auto</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </label>
          <label class="row not-loading">Input field
            <select id="input">
              <option value="">None</option>
              <option value="text">text</option>
              <option value="email">email</option>
              <option value="password">password</option>
              <option value="number">number</option>
              <option value="tel">tel</option>
              <option value="url">url</option>
              <option value="search">search</option>
              <option value="date">date</option>
              <option value="time">time</option>
              <option value="month">month</option>
              <option value="week">week</option>
              <option value="datetime-local">datetime-local</option>
              <option value="textarea">textarea</option>
              <option value="select">select</option>
            </select>
          </label>
          <label class="row">Custom class
            <input id="customClass" type="text" placeholder="optional — on the dialog">
          </label>
          <div class="checks">
            <label><input id="bootstrapSkin" type="checkbox"> Bootstrap style</label>
            <label class="not-loading"><input id="icon" type="checkbox"> Show icon</label>
            <label><input id="backdrop" type="checkbox" checked> Dim the page</label>
            <label class="not-loading"><input id="outside" type="checkbox" checked> Close on backdrop click</label>
            <label class="not-loading"><input id="escape" type="checkbox" checked> Close on Escape</label>
            <label class="not-loading"><input id="timer" type="checkbox"> Auto-close after 2s</label>
          </div>
        </section>
      </div>

      <section class="card" style="margin-top: 16px">
        <div class="card-head">
          <h2>JavaScript</h2>
          <button class="btn btn-quiet" id="copyBtn" type="button">Copy</button>
        </div>
        <pre class="code" id="snippet"></pre>
      </section>

      <section class="card" style="margin-top: 16px">
        <h2>Promise result</h2>
        <div class="log" id="log">Press Show to open the dialog.</div>
      </section>
      <p class="hint">npm <code>modern-alert</code> · <a href="https://github.com/PaulsDigital/modern-alert">GitHub</a></p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/modern-alert@1.3.0/src/modern-alert.js"></script>
  <script>
    const presets = {
      success: {
        label: 'success',
        note: 'Completed action',
        type: 'success',
        title: 'Done',
        text: 'The file is saved and already in the library.',
        confirmText: 'Great'
      },
      error: {
        label: 'error',
        note: 'Something failed',
        type: 'error',
        title: 'Could not save',
        text: 'Check your connection and try again.',
        confirmText: 'Got it'
      },
      warning: {
        label: 'warning',
        note: 'Needs attention',
        type: 'warning',
        title: 'Unsaved changes',
        text: 'If you leave now, your edits will be lost.',
        confirmText: 'Stay',
        cancelText: 'Leave'
      },
      info: {
        label: 'info',
        note: 'Neutral message',
        type: 'info',
        title: 'Sync is on',
        text: 'New versions will download automatically.',
        confirmText: 'OK'
      },
      question: {
        label: 'question',
        note: 'Ask first',
        type: 'question',
        title: 'Switch theme?',
        text: 'You can switch back at any time.',
        confirmText: 'Switch'
      },
      confirm: {
        label: 'confirm',
        note: 'Two actions',
        type: 'confirm',
        title: 'Delete this project?',
        text: 'Files stay in the trash for 30 days.',
        confirmText: 'Delete',
        cancelText: 'Cancel'
      },
      loading: {
        label: 'loading',
        note: 'Then success',
        type: 'loading',
        title: 'Saving…',
        text: 'This will take a couple of seconds.'
      },
      html: {
        label: 'custom HTML',
        note: 'Markup inside',
        type: 'info',
        title: "What's new",
        html: '<p>You can pass <strong>your own markup</strong>.</p><ul><li>Lists and emphasis</li><li>Links like <a href="https://example.com">example.com</a></li></ul>',
        confirmText: 'Close'
      },
      input: {
        label: 'input',
        note: 'Field + validation',
        type: 'question',
        title: 'What is your name?',
        text: 'The value is returned in the promise result.',
        confirmText: 'Continue',
        cancelText: 'Cancel',
        input: 'text',
        inputPlaceholder: 'Anna'
      }
    };

    const nav = document.getElementById('nav');
    const logEl = document.getElementById('log');
    const snippetEl = document.getElementById('snippet');
    const copyBtn = document.getElementById('copyBtn');
    const titleInput = document.getElementById('title');
    const textInput = document.getElementById('text');
    const htmlInput = document.getElementById('html');
    const confirmInput = document.getElementById('confirmText');
    const cancelInput = document.getElementById('cancelText');
    const themeInput = document.getElementById('theme');
    const fieldInput = document.getElementById('input');
    const customClassInput = document.getElementById('customClass');
    const outsideInput = document.getElementById('outside');
    const escapeInput = document.getElementById('escape');
    const iconInput = document.getElementById('icon');
    const backdropInput = document.getElementById('backdrop');
    const bootstrapSkinInput = document.getElementById('bootstrapSkin');
    const timerInput = document.getElementById('timer');
    const htmlRow = document.querySelector('.html-only');
    let current = 'success';
    let loadingSeq = 0;

    Object.keys(presets).forEach((key) => {
      const item = presets[key];
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.key = key;
      btn.innerHTML = item.label + '<small>' + item.note + '</small>';
      btn.addEventListener('click', () => {
        current = key;
        applyPreset(item);
        markNav();
        renderSnippet();
      });
      nav.appendChild(btn);
    });

    function markNav() {
      [...nav.children].forEach((btn) => {
        btn.classList.toggle('is-active', btn.dataset.key === current);
      });
      document.getElementById('heading').textContent = presets[current].label;
      document.getElementById('lead').textContent = current === 'loading'
        ? 'Show opens a spinner, then replaces it with success.'
        : 'Pick a type, tweak options, then press Show.';
      document.querySelector('.app').classList.toggle('is-loading', current === 'loading');
      document.querySelector('.app').classList.toggle('is-html', current === 'html');
      htmlRow.hidden = current !== 'html';
    }

    function applyPreset(item) {
      titleInput.value = item.title || '';
      textInput.value = item.text || '';
      htmlInput.value = item.html || '';
      confirmInput.value = item.confirmText || 'OK';
      cancelInput.value = item.cancelText || '';
      fieldInput.value = item.input || '';
      iconInput.checked = Boolean(item.icon);
      timerInput.checked = false;
    }

    function inputExtras(kind) {
      if (kind === 'email') return { inputPlaceholder: 'you@site.com' };
      if (kind === 'password') {
        return {
          inputPlaceholder: 'At least 8 characters',
          inputAttributes: { autocomplete: 'new-password', minlength: 8 }
        };
      }
      if (kind === 'number') {
        return {
          inputLabel: 'Seats',
          inputValue: '2',
          inputAttributes: { min: 1, max: 12, step: 1 }
        };
      }
      if (kind === 'tel') return { inputPlaceholder: '+1 555 0100' };
      if (kind === 'url') return { inputPlaceholder: 'https://example.com' };
      if (kind === 'search') return { inputPlaceholder: 'Search' };
      if (kind === 'date') return { inputAttributes: { min: '2020-01-01' } };
      if (kind === 'textarea') return { inputPlaceholder: 'A longer note' };
      if (kind === 'select') {
        return {
          inputLabel: 'Currency',
          inputOptions: { usd: 'USD', eur: 'EUR', gbp: 'GBP' },
          inputValue: 'eur'
        };
      }
      if (kind === 'text') return { inputPlaceholder: presets.input.inputPlaceholder || 'Enter a value' };
      return {};
    }

    function attachValidator(options) {
      const kind = options.input;
      if (!kind || kind === 'select' || kind === 'date' || kind === 'time' || kind === 'month' || kind === 'week' || kind === 'datetime-local') {
        return;
      }

      options.inputValidator = function (value) {
        const raw = String(value || '').trim();
        if (!raw) return 'This field is required';
        if (kind === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(raw)) {
          return 'Enter a valid email';
        }
        if (kind === 'url') {
          try { new URL(raw); } catch (err) { return 'Enter a valid URL'; }
        }
        if (kind === 'number') {
          const n = Number(raw);
          if (!Number.isFinite(n)) return 'Enter a number';
          if (n < 1 || n > 12) return 'Use 1–12';
          return;
        }
        if (kind === 'password' && raw.length < 8) return 'Use at least 8 characters';
        if (kind !== 'number' && kind !== 'password' && raw.length < 2) return 'Too short';
      };
    }

    function collect() {
      const preset = presets[current];
      const options = {
        type: preset.type,
        title: titleInput.value,
        confirmText: confirmInput.value || 'OK',
        theme: themeInput.value,
        style: bootstrapSkinInput.checked ? 'bootstrap' : 'default',
        backdrop: backdropInput.checked
      };

      if (current === 'html') {
        options.html = htmlInput.value;
      } else {
        options.text = textInput.value;
      }

      if (customClassInput.value.trim()) options.customClass = customClassInput.value.trim();

      if (current === 'loading') {
        options.type = 'loading';
        delete options.confirmText;
        return options;
      }

      options.allowOutsideClick = outsideInput.checked;
      options.allowEscapeKey = escapeInput.checked;
      options.timer = timerInput.checked ? 2000 : 0;
      options.icon = iconInput.checked;

      if (cancelInput.value) options.cancelText = cancelInput.value;

      const inputKind = fieldInput.value;
      if (inputKind) {
        options.input = inputKind;
        Object.assign(options, inputExtras(inputKind));
        attachValidator(options);
      }

      return options;
    }

    function jsValue(value) {
      if (value && typeof value === 'object' && !Array.isArray(value)) {
        const keys = Object.keys(value);
        return '{ ' + keys.map((key) => key + ': ' + JSON.stringify(value[key])).join(', ') + ' }';
      }
      return JSON.stringify(value);
    }

    function formatOptions(options) {
      const omit = {
        allowOutsideClick: true,
        allowEscapeKey: true,
        timer: 0,
        confirmText: 'OK',
        theme: 'auto',
        backdrop: true
      };
      const order = [
        'type', 'title', 'text', 'html', 'confirmText', 'cancelText',
        'input', 'inputPlaceholder', 'inputLabel', 'inputOptions', 'inputValue', 'inputAttributes',
        'icon', 'theme', 'style', 'customClass', 'backdrop', 'allowOutsideClick', 'allowEscapeKey', 'timer'
      ];
      const props = [];

      order.forEach((key) => {
        if (!Object.prototype.hasOwnProperty.call(options, key)) return;
        const value = options[key];
        if (value == null || value === '') return;
        if (Object.prototype.hasOwnProperty.call(omit, key) && omit[key] === value) return;
        if (key === 'icon' && value === false) return;
        if (key === 'style' && value === 'default') return;
        props.push(key + ': ' + jsValue(value));
      });

      if (typeof options.inputValidator === 'function') {
        const kind = options.input;
        const lines = ['inputValidator: (value) => {', "    const raw = String(value || '').trim()", "    if (!raw) return 'This field is required'"];
        if (kind === 'email') {
          lines.push(String.raw`    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(raw)) return 'Enter a valid email'`);
        }
        if (kind === 'url') {
          lines.push("    try { new URL(raw) } catch (err) { return 'Enter a valid URL' }");
        }
        if (kind === 'number') {
          lines.push('    const n = Number(raw)', "    if (!Number.isFinite(n)) return 'Enter a number'", "    if (n < 1 || n > 12) return 'Use 1–12'");
        } else if (kind === 'password') {
          lines.push("    if (raw.length < 8) return 'Use at least 8 characters'");
        } else {
          lines.push("    if (raw.length < 2) return 'Too short'");
        }
        lines.push('  }');
        props.push(lines.join('\n'));
      }

      return props.map((prop) => '  ' + prop).join(',\n');
    }

    function renderSnippet() {
      const options = collect();
      const body = formatOptions(options);
      let code = 'const result = await ModernAlert.show({\n' + body + '\n})';

      if (current === 'loading') {
        const extra = [];
        if (themeInput.value !== 'auto') extra.push('theme: ' + JSON.stringify(themeInput.value));
        if (bootstrapSkinInput.checked) extra.push("style: 'bootstrap'");
        const third = extra.length ? ', { ' + extra.join(', ') + ' }' : '';
        code =
          'ModernAlert.show({\n' + body + '\n})\n\n' +
          'setTimeout(() => {\n' +
          '  ModernAlert.success(\'Saved\', \'You can keep working.\'' + third + ')\n' +
          '}, 1700)';
      }

      snippetEl.textContent = code;
    }

    function printResult(result) {
      logEl.textContent = JSON.stringify(result, null, 2);
    }

    async function launch() {
      const seq = ++loadingSeq;
      const options = collect();

      if (current === 'loading') {
        logEl.textContent = 'loading…';
        ModernAlert.show(options);
        await wait(1700);
        if (seq !== loadingSeq || !ModernAlert.isVisible()) return;
        const extra = { theme: themeInput.value };
        if (bootstrapSkinInput.checked) extra.style = 'bootstrap';
        printResult(await ModernAlert.success('Saved', 'You can keep working.', extra));
        return;
      }

      printResult(await ModernAlert.show(options));
    }

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    [
      titleInput, textInput, htmlInput, confirmInput, cancelInput, customClassInput,
      themeInput, fieldInput, outsideInput, escapeInput, timerInput, iconInput,
      backdropInput, bootstrapSkinInput
    ].forEach((el) => {
      el.addEventListener('input', renderSnippet);
      el.addEventListener('change', renderSnippet);
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(snippetEl.textContent);
        copyBtn.textContent = 'Copied';
        setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1200);
      } catch (err) {
        copyBtn.textContent = 'Copy failed';
        setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1200);
      }
    });

    document.getElementById('showBtn').addEventListener('click', () => launch());

    applyPreset(presets.success);
    markNav();
    renderSnippet();
  </script>
</body>
</html>
